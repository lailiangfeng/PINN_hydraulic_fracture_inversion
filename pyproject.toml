[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-phasefield-demo"
version = "0.1.0"
description = "A compact FEniCSx phase-field hydraulic-fracture demonstration"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Liangfeng Lai"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering"
]

[project.scripts]
hf-demo = "hf_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
